<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отзывы — Банкетный зал «Счастье»</title>
  <meta name="description" content="Отзывы гостей о банкетном зале «Счастье». Узнайте, что говорят о нас клиенты.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header" id="header">
    <div class="container">
      <div class="header__inner">
        <a href="index.html" class="logo">
          <span class="logo__icon">&#9825;</span>
          <span class="logo__text">Счастье</span>
        </a>
        <nav class="nav" id="nav">
          <a href="about.html" class="nav__link">О нас</a>
          <a href="services.html" class="nav__link">Услуги</a>
          <a href="gallery.html" class="nav__link">Фото</a>
          <a href="tour.html" class="nav__link">3D-тур</a>
          <a href="reviews.html" class="nav__link">Отзывы</a>
          <a href="contact.html" class="nav__link">Контакты</a>
        </nav>
        <button class="burger" id="burger" aria-label="Открыть меню">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1 class="page-hero__title">Отзывы</h1>
      <p class="page-hero__subtitle">Что говорят наши гости</p>
    </div>
  </section>

  <section class="section reviews">
    <div class="container">
      <div class="reviews__slider" id="reviewsSlider"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <div class="footer__brand">
          <span class="footer__logo">Банкетный зал «Счастье»</span>
          <p class="footer__copy">&copy; 2026 Все права защищены</p>
        </div>
        <nav class="footer__nav">
          <a href="about.html">О нас</a>
          <a href="services.html">Услуги</a>
          <a href="gallery.html">Фото</a>
          <a href="tour.html">3D-тур</a>
          <a href="reviews.html">Отзывы</a>
          <a href="contact.html">Контакты</a>
        </nav>
      </div>
    </div>
  </footer>

  <script>
    fetch('https://banket-schastie.onrender.com/api/reviews')
      .then(r => r.json())
      .then(data => {
        const slider = document.getElementById('reviewsSlider');
        slider.innerHTML = data.map(r => `
          <div class="review-card">
            <div class="review-card__stars">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</div>
            <p class="review-card__text">«${r.text}»</p>
            <div class="review-card__author">
              <strong>${r.author}</strong>
              ${r.event ? `<span>${r.event}</span>` : ''}
            </div>
          </div>
        `).join('');
      });
  </script>
  <script src="js/main.js"></script>
</body>
</html>
