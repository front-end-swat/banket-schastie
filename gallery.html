<!DOCTYPE html>
<html lang="ru">
<head>

  <link rel="stylesheet" href="css/style.css">

<body>

  <header class="header" id="header">
    <div class="container">
      <div class="header__inner">
        <a href="index.html" class="logo">
          <span class="logo__icon">&#9825;</span>
          <span class="logo__text">Счастье</span>

        <nav class="nav" id="nav">

      <div class="gallery__grid" id="galleryGrid">

        <div class="gallery__item" data-category="decor">
          <img src="images/gallery/img-2.jpg" alt="Оформление стола">

          <img src="images/gallery/img-3.jpg" alt="Торжество">
        </div>

        <div class="gallery__item" data-category="decor">
          <img src="images/gallery/img-6.jpg" alt="Банкет">
        </div>
        <div class="gallery__item" data-category="decor">
          <img src="images/gallery/img-7.jpg" alt="Декор">

        <div class="gallery__item gallery__item--wide" data-category="interior">
          <img src="images/gallery/img-8.jpg" alt="Вечернее освещение">
        </div>

    </div>

          <span class="footer__logo">Банкетный зал «Счастье»</span>
